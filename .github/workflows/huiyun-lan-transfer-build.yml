name: Huiyun LAN Transfer Build

on:
  pull_request:
    paths:
      - "huiyun-lan-transfer/**"
      - ".github/workflows/huiyun-lan-transfer-build.yml"
  push:
    tags:
      - "huiyun-lan-transfer-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows portable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: huiyun-lan-transfer

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build portable EXE
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1

      - name: Upload Windows portable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: huiyun-lan-transfer-Windows-portable
          path: huiyun-lan-transfer/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS universal portable
    runs-on: macos-latest
    defaults:
      run:
        working-directory: huiyun-lan-transfer

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build universal app
        run: bash scripts/build-macos.sh

      - name: Upload macOS portable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: huiyun-lan-transfer-macOS-universal
          path: |
            huiyun-lan-transfer/dist/*.dmg
            huiyun-lan-transfer/dist/*.zip
          if-no-files-found: error
          retention-days: 14
