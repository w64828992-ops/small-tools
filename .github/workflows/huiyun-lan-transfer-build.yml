name: Huiyun LAN Transfer Build

on:
  pull_request:
    paths:
      - "huiyun-lan-transfer/**"
      - ".github/workflows/huiyun-lan-transfer-build.yml"
  push:
    tags:
      - "huiyun-lan-transfer-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            command: npm run dist:win
          - os: macos-latest
            label: macOS universal
            command: npm run dist:mac

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: huiyun-lan-transfer
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: huiyun-lan-transfer/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

      - name: Static check
        run: npm run check:syntax

      - name: Package
        run: ${{ matrix.command }}

      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: huiyun-lan-transfer-Windows
          path: huiyun-lan-transfer/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: huiyun-lan-transfer-macOS
          path: |
            huiyun-lan-transfer/dist/*.dmg
            huiyun-lan-transfer/dist/*.zip
          if-no-files-found: error
          retention-days: 14
